schema: spec-driven

context: |
  仕様書、提案、設計、タスクは日本語で記述する。
  WindowsのPowerShellとLinuxの両方で動くことを維持する。
  Web公開に届かなかった発話の復元、パスコード付き公開ページへの対応は現行の対象外。
  Web閲覧ページの通信は公開された安定APIとは限らない。
  通信仕様を変更するときは実際の閲覧ページと応答を確認し、
  観測した事実、推測、未確認事項を区別する。
  実際の公開URL、OBSパスワード、会話本文を資料やテストに含めない。

rules:
  proposal:
    - 変更する利用者向けの動作と対象外を明記する。
  specs:
    - 要件にはSHALLまたはMUSTを使い、シナリオは具体的な条件と観測可能な結果を書く。
    - 初回起動と再接続、通信失敗と終了操作を区別する。
  design:
    - 取得位置、字幕の保持値、OBS応答待ちに影響する変更では状態遷移と失敗時の扱いを説明する。
  tasks:
    - 資料更新、必要な回帰テスト、最小実装、最終確認の順で整理する。
    - コード変更にはpnpm testとgit diff --checkを含め、実機未確認の環境を検証済みとしない。
